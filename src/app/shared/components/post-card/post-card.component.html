
<mat-card class="example-card mt-4 h-100 d-flex flex-column justify-content-between">
    <mat-card-title>{{postObj.title}}</mat-card-title>
    <mat-card-content>
        <p>{{postObj.body}}</p>
    </mat-card-content>
    <mat-card-actions class="d-flex justify-content-between">
        <button mat-raised-button color="primary">Edit</button>
        <button mat-raised-button color="warn">Remove</button>
    </mat-card-actions>
</mat-card>
