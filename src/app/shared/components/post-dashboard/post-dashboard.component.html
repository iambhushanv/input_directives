
<div class="row" *ngIf="postArr.length > 0; else noPost">
    <div class="col-md-4 mb-4" *ngFor=" let post of postArr; trackBy : trackByFun">
        <app-post-card [postObj]="post"></app-post-card>
    </div>
</div>

<ng-template #noPost>
    <p class="alert alert-info">
        No Post Data added yet !!!
    </p>
</ng-template>
